<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Audiobook Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>Audiobook Creator</h1>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/library" class="active">Library</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Your Audiobook Library</h2>
            <p>All your audiobooks in one place.</p>
        </section>

        <section class="library-container">
            <div class="library-controls">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search audiobooks...">
                    <button id="search-btn" class="btn">Search</button>
                </div>
                <div class="sort-options">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select">
                        <option value="name">Name</option>
                        <option value="date">Date Added</option>
                        <option value="size">Size</option>
                    </select>
                </div>
            </div>

            <div class="library-grid" id="audiobook-list">
                <!-- Audiobooks will be loaded here via JavaScript -->
                <div class="loading-indicator">Loading your library...</div>
            </div>
        </section>

        <section class="library-player">
            <h3>Now Playing</h3>
            <div id="library-audio-player">
                <div id="library-player-container">
                    <audio id="library-audio-element" controls></audio>
                </div>
                <div id="library-player-info">
                    <div id="library-current-title">No audio selected</div>
                    <div id="library-time-display">
                        <span id="library-current-time">0:00</span> / 
                        <span id="library-duration">0:00</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Audiobook Creator. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/library.js') }}"></script>
</body>
</html>
